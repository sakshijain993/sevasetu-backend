
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: organization-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/organizations/**

            - id: need-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/needs/**

server:
  port: 8080
